<section id="szolgaltatasok" class="v-services-section py-5">
  <div class="container py-5">
    
    <!-- Modernizált fejléc (Mint a többi aloldalon) -->
    <div class="v-header text-center mb-5 pb-3">
      <span class="v-subtitle">Kínálatunk</span>
      <h2 [attr.role]="standalonePage ? 'heading' : null" [attr.aria-level]="standalonePage ? '1' : null" class="v-section-title mb-3">
        SZOLGÁLTATÁSAINK
      </h2>
      <div class="v-divider mx-auto"></div>
    </div>

    <div class="row g-4 justify-content-center">
      @for (service of services; track service.title) {
        <div class="col-md-6 col-lg-4">
          <a [routerLink]="['/szolgaltatasok', service.url]" class="v-card text-decoration-none h-100 d-flex flex-column">
            
            <div class="v-card-img-wrap position-relative overflow-hidden">
              <img [src]="service.image" [alt]="service.title" class="v-card-img" loading="lazy">
              <!-- Finom sötétedő réteg hover esetén -->
              <div class="v-card-overlay"></div>
            </div>

            <div class="v-card-body p-4 p-xl-5 d-flex flex-column flex-grow-1 justify-content-between">
              <h3 class="v-card-heading mb-0">{{ service.title }}</h3>
              
              <div class="v-card-link mt-4 pt-3 d-flex align-items-center justify-content-between">
                <span class="link-text">Részletek</span>
                <span class="arrow-wrap">
                  <i class="bi bi-arrow-right"></i>
                </span>
              </div>
            </div>

          </a>
        </div>
      }
    </div>

  </div>
</section>
